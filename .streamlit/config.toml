[server]
headless = true
enableStaticServing = true
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#3fbf86"
backgroundColor = "#f5fcfa"
secondaryBackgroundColor = "#e8efec"
textColor = "#0b1512"
borderColor = "#d9e0de"
baseRadius = "0.6rem"
font = "IBM Plex Mono"
headingFont = "IBM Plex Sans"
codeFont = "IBM Plex Mono"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-400-latin.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-500-latin.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-700-latin.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-400-latin-ext.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-400-latin.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
